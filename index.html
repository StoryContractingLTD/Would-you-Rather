  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"458539e0-0f07-4c1f-88e0-c5e5cac4cc35\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"98755371-7cb6-4f8c-acbb-79c4f9ae82aa\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dd0c78be-7cb3-4852-b7b4-ddf7db3b7893\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"c34f5991-a951-441d-94de-8083602aed7d\"><\u002Fscript>\n<script src=\"0a195664-cc83-408f-962c-44cd729e9195\"><\u002Fscript>\n<style>\n  html, body { margin: 0; padding: 0; background: #0061ad; }\n  a { color: #026cb8; text-decoration: none; }\n  a:hover { color: #004f8c; }\n  * { box-sizing: border-box; }\n  textarea:focus, input:focus { outline: 3px solid rgba(0,97,173,0.35); outline-offset: 1px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height: 100vh; display: flex; flex-direction: column; background: #0061ad; font-family: Arial, 'Helvetica Neue', sans-serif; color: #ffffff; padding: clamp(16px, 2.4vw, 42px); gap: clamp(12px, 2vh, 26px)\">\n\n  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap\">\n    <img src=\"fc99f3eb-ccb7-4d3a-a12a-c89be64492aa\" alt=\"Story Contracting\" style=\"height: clamp(24px, 3vh, 42px); width: auto; display: block\">\n    <div style=\"display: flex; align-items: center; gap: clamp(10px, 1.5vw, 20px); font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(10px, 1.2vh, 13px); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.85); flex-wrap: wrap\">\n      <span>{{ sessionTitle }}<\u002Fspan>\n      <span style=\"width: 1px; height: 15px; background: rgba(255,255,255,0.4)\"><\u002Fspan>\n      <span>{{ progressLabel }}<\u002Fspan>\n      <span style=\"{{ liveBadgeStyle }}\">{{ liveLabel }}<\u002Fspan>\n      <div style=\"display: flex; gap: 0; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; overflow: hidden\">\n        <button type=\"button\" sc-camel-on-click=\"{{ showHost }}\" style=\"{{ hostTabStyle }}\">Room screen<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ showPhone }}\" style=\"{{ phoneTabStyle }}\">Phone<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSetup }}\">\n    <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(8px, 2vh, 30px) 0\">\n      <div style=\"width: min(100%, 720px); background: #ffffff; color: #14181c; border-radius: 6px; padding: clamp(20px, 3vw, 40px); display: flex; flex-direction: column; gap: 18px; box-shadow: 0 8px 24px rgba(0,25,50,0.22)\">\n        <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(11px, 1.3vh, 14px); letter-spacing: 0.2em; text-transform: uppercase; color: #60666d\">Set up live voting<\u002Fdiv>\n        <h2 style=\"margin: 0; font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(22px, 3vh, 34px); line-height: 1.15\">Connect a free Supabase project<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #3a4148; max-width: 66ch\">Live results need somewhere for the phones and this screen to meet. A free Supabase project does the job and takes about five minutes to set up. Do it once, and this browser remembers it.<\u002Fp>\n        <ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.7; color: #3a4148; display: flex; flex-direction: column; gap: 4px\">\n          <li>Go to supabase.com and create a free project. Any region near you is fine.<\u002Fli>\n          <li>Open Project Settings, then API.<\u002Fli>\n          <li>Copy the Project URL and the anon public key.<\u002Fli>\n          <li>Open the SQL editor and run the snippet below once. It creates the answers table so totals survive a reload.<\u002Fli>\n          <li>Paste both below and save. The QR code then carries them to each phone, so students need no setup.<\u002Fli>\n        <\u002Fol>\n        <pre style=\"margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; color: #14181c; background: #f4f6f7; border: 1px solid #d3d7db; border-radius: 4px; padding: 12px; overflow: auto; white-space: pre\">create table if not exists wyr_answers (\n  room text not null,\n  q int not null,\n  client text not null,\n  choice text not null,\n  created_at timestamptz default now(),\n  primary key (room, q, client)\n);\nalter table wyr_answers enable row level security;\ncreate policy wyr_open on wyr_answers for all to anon using (true) with check (true);\nalter publication supabase_realtime add table wyr_answers;<\u002Fpre>\n        <div style=\"display: grid; gap: 12px\">\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 13px; color: #3a4148\">Project URL\n            <input type=\"text\" value=\"{{ urlText }}\" sc-camel-on-change=\"{{ onUrlChange }}\" placeholder=\"https://abcdefghijkl.supabase.co\" style=\"width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: #14181c; background: #f4f6f7; border: 1px solid #d3d7db; border-radius: 4px; padding: 12px; min-height: 44px\">\n          <\u002Flabel>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 13px; color: #3a4148\">Anon public key\n            <textarea rows=\"3\" value=\"{{ keyText }}\" sc-camel-on-change=\"{{ onKeyChange }}\" placeholder=\"eyJhbGciOi...\" style=\"width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; color: #14181c; background: #f4f6f7; border: 1px solid #d3d7db; border-radius: 4px; padding: 12px; resize: vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cfgError }}\">\n          <div style=\"font-size: 14px; line-height: 1.5; color: #b3261e; font-weight: bold\">{{ cfgError }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center\">\n          <button type=\"button\" sc-camel-on-click=\"{{ saveCfg }}\" style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff; background: #0061ad; border: 0; border-radius: 4px; padding: 14px 24px; min-height: 44px; cursor: pointer; transition: background 200ms cubic-bezier(.2,.7,.2,1)\" style-hover=\"background: #004f8c\">Save and connect<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ skipCfg }}\" style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #0061ad; background: transparent; border: 2px solid #0061ad; border-radius: 4px; padding: 12px 22px; min-height: 44px; cursor: pointer; transition: background 200ms cubic-bezier(.2,.7,.2,1)\" style-hover=\"background: #dee0e1\">Run without live voting<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size: 13px; line-height: 1.5; color: #60666d; max-width: 66ch\">Answers are stored against the room code so reloading the room screen keeps the totals. Nothing personal is collected: each phone holds an anonymous id and a letter. The anon key is safe to use in a page like this.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHostView }}\">\n    <div style=\"flex: 1; display: flex; flex-direction: column; gap: clamp(12px, 2vh, 26px); min-height: 0\">\n\n      <sc-if value=\"{{ isJoin }}\">\n        <div style=\"flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(22px, 4vw, 68px); align-items: center; padding: clamp(6px, 1.6vh, 34px) 0\">\n          <div style=\"display: flex; flex-direction: column; gap: clamp(12px, 1.8vh, 24px); min-width: 0\">\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(11px, 1.4vh, 16px); letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.8)\">Icebreaker<\u002Fdiv>\n            <h1 style=\"margin: 0; font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: clamp(40px, 8vw, 138px); line-height: 0.88; letter-spacing: -0.02em; text-wrap: balance\">Would You<br>Rather?<\u002Fh1>\n            <p style=\"margin: 0; max-width: 36ch; font-size: clamp(15px, 2vh, 23px); line-height: 1.5; color: rgba(255,255,255,0.92); text-wrap: pretty\">{{ joinBlurb }}<\u002Fp>\n            <div style=\"display: flex; align-items: center; gap: clamp(12px, 1.6vw, 22px); flex-wrap: wrap; margin-top: clamp(2px, 0.8vh, 12px)\">\n              <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(14px, 1.9vh, 20px); letter-spacing: 0.04em; text-transform: uppercase; color: #0061ad; background: #ffffff; border: 0; border-radius: 4px; padding: clamp(13px, 1.8vh, 20px) clamp(24px, 3vw, 38px); min-height: 44px; cursor: pointer; transition: background 200ms cubic-bezier(.2,.7,.2,1)\" style-hover=\"background: #dee0e1\">Start Question 1 →<\u002Fbutton>\n              <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(13px, 1.7vh, 18px)\">{{ joinedLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 1.8vh, 22px); min-width: 0\">\n            <div style=\"background: #ffffff; padding: clamp(14px, 1.8vw, 24px); border-radius: 4px; box-shadow: 0 8px 24px rgba(0,25,50,0.22); width: clamp(170px, 21vw, 290px); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center\">\n              <sc-if value=\"{{ hasQr }}\">\n                <img ref=\"{{ qrRef }}\" alt=\"Join QR code\" style=\"width: 100%; height: 100%; display: block\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ noQr }}\">\n                <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 13px; line-height: 1.4; color: #60666d; text-align: center; padding: 12px\">QR code<br>for the join link<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"text-align: center; display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(11px, 1.3vh, 14px); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.8)\">{{ joinHint }}<\u002Fdiv>\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(20px, 3vh, 36px); letter-spacing: 0.1em\">{{ roomCode }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isVoting }}\">\n        <div style=\"flex: 1; display: flex; flex-direction: column; gap: clamp(12px, 2vh, 26px); min-height: 0\">\n          <div style=\"display: flex; align-items: baseline; gap: clamp(14px, 2vw, 28px); flex-wrap: wrap\">\n            <h2 style=\"margin: 0; flex: 1; min-width: min(100%, 320px); font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(22px, 3.8vh, 52px); line-height: 1.12; letter-spacing: -0.01em; max-width: 32ch; text-wrap: balance\">{{ q.prompt }}<\u002Fh2>\n            <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 2px\">\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(28px, 4.6vh, 62px); line-height: 1; font-variant-numeric: tabular-nums\">{{ answeredCount }}<\u002Fdiv>\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(10px, 1.2vh, 13px); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.75)\">Answers in<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(14px, 2vw, 28px); min-height: 0\">\n            <div style=\"{{ cardAStyle }}\">\n              <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; font-size: clamp(26px, 4.2vh, 56px); line-height: 1; opacity: 0.45\">A<\u002Fspan>\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(20px, 3.2vh, 42px); line-height: 1.16; text-wrap: pretty\">{{ q.a }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ cardBStyle }}\">\n              <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; font-size: clamp(26px, 4.2vh, 56px); line-height: 1; opacity: 0.45\">B<\u002Fspan>\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(20px, 3.2vh, 42px); line-height: 1.16; text-wrap: pretty\">{{ q.b }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; align-items: center; gap: clamp(8px, 1.2vw, 16px); flex-wrap: wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"{{ ghostBtn }}\" style-hover=\"background: rgba(255,255,255,0.15)\">← Back<\u002Fbutton>\n            <div style=\"flex: 1\"><\u002Fdiv>\n            <span style=\"font-size: clamp(11px, 1.4vh, 15px); color: rgba(255,255,255,0.7)\">{{ votingHint }}<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"{{ primaryBtn }}\" style-hover=\"background: #dee0e1\">Show results →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isResults }}\">\n        <div style=\"flex: 1; display: flex; flex-direction: column; gap: clamp(12px, 2vh, 24px); min-height: 0\">\n          <div style=\"display: flex; align-items: baseline; gap: clamp(14px, 2vw, 28px); flex-wrap: wrap\">\n            <div style=\"flex: 1; min-width: min(100%, 300px); display: flex; flex-direction: column; gap: 4px\">\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(10px, 1.2vh, 13px); letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.75)\">Results, question {{ questionNumber }}<\u002Fdiv>\n              <h2 style=\"margin: 0; font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(19px, 2.8vh, 38px); line-height: 1.15; max-width: 34ch; text-wrap: balance\">{{ q.prompt }}<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(13px, 1.7vh, 19px); color: rgba(255,255,255,0.85)\">{{ resultsTotalLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(14px, 2vw, 28px)\">\n            <div style=\"{{ resultAStyle }}\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px\">\n                <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; font-size: clamp(20px, 3vh, 40px); line-height: 1; opacity: 0.45\">A<\u002Fspan>\n                <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(34px, 6vh, 82px); line-height: 0.95; font-variant-numeric: tabular-nums\">{{ pctALabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(16px, 2.3vh, 28px); line-height: 1.2; text-wrap: pretty\">{{ q.a }}<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n                <div style=\"flex: 1; height: clamp(8px, 1.1vh, 14px); background: rgba(0,0,0,0.18); border-radius: 2px; overflow: hidden\">\n                  <div style=\"{{ barAStyle }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(12px, 1.5vh, 16px); white-space: nowrap\">{{ countALabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ resultBStyle }}\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px\">\n                <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; font-size: clamp(20px, 3vh, 40px); line-height: 1; opacity: 0.45\">B<\u002Fspan>\n                <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(34px, 6vh, 82px); line-height: 0.95; font-variant-numeric: tabular-nums\">{{ pctBLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(16px, 2.3vh, 28px); line-height: 1.2; text-wrap: pretty\">{{ q.b }}<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n                <div style=\"flex: 1; height: clamp(8px, 1.1vh, 14px); background: rgba(0,0,0,0.18); border-radius: 2px; overflow: hidden\">\n                  <div style=\"{{ barBStyle }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(12px, 1.5vh, 16px); white-space: nowrap\">{{ countBLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-top: 2px solid rgba(255,255,255,0.35); padding-top: clamp(10px, 1.4vh, 18px); display: flex; gap: clamp(14px, 2.6vw, 36px); align-items: baseline; flex-wrap: wrap\">\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(10px, 1.2vh, 14px); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.75); white-space: nowrap\">Talk about it<\u002Fdiv>\n            <div style=\"flex: 1; min-width: min(100%, 280px); font-size: clamp(16px, 2.1vh, 26px); line-height: 1.4; max-width: 74ch; text-wrap: pretty\">{{ q.discuss }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ notesOpen }}\">\n            <div style=\"background: #004f8c; border-radius: 4px; padding: clamp(12px, 1.8vw, 22px); display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(10px, 1.2vh, 13px); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.8)\">Host notes, not for the room<\u002Fdiv>\n              <sc-for list=\"{{ notes }}\" as=\"note\" hint-placeholder-count=\"3\">\n                <div style=\"display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 12px; align-items: baseline\">\n                  <div style=\"color: rgba(255,255,255,0.6)\">•<\u002Fdiv>\n                  <div style=\"font-size: clamp(13px, 1.7vh, 18px); line-height: 1.45; text-wrap: pretty\">{{ note.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display: flex; align-items: center; gap: clamp(8px, 1.2vw, 16px); flex-wrap: wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"{{ ghostBtn }}\" style-hover=\"background: rgba(255,255,255,0.15)\">← Back to voting<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleNotes }}\" style=\"{{ ghostBtn }}\" style-hover=\"background: rgba(255,255,255,0.15)\">{{ notesLabel }}<\u002Fbutton>\n            <div style=\"flex: 1\"><\u002Fdiv>\n            <span style=\"font-size: clamp(11px, 1.4vh, 15px); color: rgba(255,255,255,0.7)\">Take as long as you like here<\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"{{ primaryBtn }}\" style-hover=\"background: #dee0e1\">{{ nextLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size: clamp(11px, 1.3vh, 15px); color: rgba(255,255,255,0.6)\">Arrow keys move back and forward. N shows your notes.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isEnd }}\">\n        <div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; gap: clamp(12px, 2.2vh, 28px); padding: clamp(6px, 1.6vh, 30px) 0\">\n          <h2 style=\"margin: 0; font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: clamp(32px, 6vw, 94px); line-height: 0.9; letter-spacing: -0.02em\">Every Job Is<br>A Trade Off<\u002Fh2>\n          <p style=\"margin: 0; max-width: 62ch; font-size: clamp(15px, 2vh, 24px); line-height: 1.5; text-wrap: pretty\">Rare species, ancient finds, noise, water, badgers, bats, trees. On a live site these all land on someone's desk at once, and the answer is rarely one or the other. Engineers plan for them before the first spade goes in.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: clamp(4px, 0.7vh, 9px); border-top: 1px solid rgba(255,255,255,0.3)\">\n            <sc-for list=\"{{ recap }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <div style=\"display: grid; grid-template-columns: clamp(26px, 2.6vw, 38px) minmax(0, 1fr) clamp(86px, 10vw, 140px); gap: clamp(10px, 1.6vw, 20px); align-items: center; border-bottom: 1px solid rgba(255,255,255,0.3); padding: clamp(5px, 0.8vh, 10px) 0\">\n                <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(13px, 1.7vh, 18px); color: rgba(255,255,255,0.7)\">{{ row.n }}<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 5px; min-width: 0\">\n                  <div style=\"font-size: clamp(13px, 1.6vh, 18px); line-height: 1.35; color: rgba(255,255,255,0.95); text-wrap: pretty\">{{ row.label }}<\u002Fdiv>\n                  <div style=\"display: flex; height: clamp(8px, 1.1vh, 13px); border-radius: 2px; overflow: hidden; background: rgba(255,255,255,0.22)\">\n                    <div style=\"{{ row.aStyle }}\"><\u002Fdiv>\n                    <div style=\"{{ row.bStyle }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(12px, 1.6vh, 17px); text-align: right; white-space: nowrap\">{{ row.score }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: clamp(10px, 1.4vw, 18px); flex-wrap: wrap; align-items: center\">\n            <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"{{ ghostBtn }}\" style-hover=\"background: rgba(255,255,255,0.15)\">← Back<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ restart }}\" style=\"{{ primaryBtn }}\" style-hover=\"background: #dee0e1\">New session<\u002Fbutton>\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-style: italic; font-size: clamp(14px, 2vh, 22px); color: rgba(255,255,255,0.85)\">Do It Right.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPhoneView }}\">\n    <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 2vh, 22px); padding: clamp(6px, 1.4vh, 26px) 0\">\n      <sc-if value=\"{{ phonePreviewNote }}\">\n        <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: clamp(10px, 1.2vh, 13px); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.75); text-align: center\">Preview of what a student sees<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"width: min(100%, 390px); background: #ffffff; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,25,50,0.22); overflow: hidden; display: flex; flex-direction: column\">\n        <div style=\"background: #0061ad; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n          <img src=\"fc99f3eb-ccb7-4d3a-a12a-c89be64492aa\" alt=\"Story Contracting\" style=\"height: 20px; width: auto; display: block\">\n          <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #ffffff\">{{ phoneStep }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ phoneWaiting }}\">\n          <div style=\"padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center\">\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 20px; line-height: 1.25; color: #14181c\">{{ phoneWaitTitle }}<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.5; color: #60666d; max-width: 30ch\">{{ phoneWaitBody }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ phoneVoting }}\">\n          <div style=\"padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 17px; line-height: 1.3; color: #14181c\">{{ q.prompt }}<\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ phoneVoteA }}\" style=\"{{ phoneA }}\" style-hover=\"filter: brightness(1.05)\">\n              <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; font-size: 22px; opacity: 0.5\">A<\u002Fspan>\n              <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 17px; line-height: 1.25; text-align: left\">{{ q.a }}<\u002Fspan>\n            <\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ phoneVoteB }}\" style=\"{{ phoneB }}\" style-hover=\"filter: brightness(1.05)\">\n              <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-style: italic; font-size: 22px; opacity: 0.5\">B<\u002Fspan>\n              <span style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 17px; line-height: 1.25; text-align: left\">{{ q.b }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ phoneDone }}\">\n          <div style=\"padding: 26px 20px 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center\">\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: #4c7a15\">Answer received<\u002Fdiv>\n            <div style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 600; font-size: 20px; line-height: 1.3; color: #14181c; max-width: 26ch\">Your pick: {{ phonePickLabel }}<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.5; color: #60666d; max-width: 30ch\">{{ phoneDoneBody }}<\u002Fdiv>\n            <sc-if value=\"{{ phoneCanChange }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ phoneChange }}\" style=\"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #0061ad; background: transparent; border: 2px solid #0061ad; border-radius: 4px; padding: 12px 20px; min-height: 44px; cursor: pointer; transition: background 200ms cubic-bezier(.2,.7,.2,1)\" style-hover=\"background: #dee0e1\">Change my answer<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"font-size: clamp(11px, 1.3vh, 14px); color: rgba(255,255,255,0.72); text-align: center; max-width: 46ch; text-wrap: pretty\">{{ phoneFootnote }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sessionTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sustainability in Engineering and Construction&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;joinUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://storycontractingltd.github.io/Would-you-Rather/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Joining&quot;}}\">\nconst QUESTIONS = [\n  {\n    prompt: \"Would you rather discover...\",\n    a: \"A rare species on site\",\n    b: \"An ancient archaeological find\",\n    discuss: \"Both of these stop the work. Who would you need to call, and what would you do while the site sits still?\",\n    notes: [\n      \"Protected species work needs an ecologist survey and often a licence before anyone goes back in.\",\n      \"Archaeology usually means a watching brief or a dig, paid for by the project, before construction restarts.\",\n      \"Ask the room who pays for the delay, and who would have spotted the risk at design stage.\"\n    ]\n  },\n  {\n    prompt: \"Would you rather deal with...\",\n    a: \"A major noise complaint from residents\",\n    b: \"A pollution incident in a river\",\n    discuss: \"One upsets the neighbours, one reaches the regulator. Which would you rather be explaining a week later?\",\n    notes: [\n      \"Noise is managed with agreed working hours, monitoring and talking to neighbours early.\",\n      \"Getting silt, fuel or concrete washings into a watercourse is an offence and the Environment Agency can prosecute.\",\n      \"Point out that water incidents are often caused by something small, like an unbunded fuel store or a burst silt bag.\"\n    ]\n  },\n  {\n    prompt: \"Would you rather...\",\n    a: \"Build a new railway through countryside and reduce car use\",\n    b: \"Protect the countryside but keep more cars on the road\",\n    discuss: \"Every big transport project runs into this. What would change your mind either way?\",\n    notes: [\n      \"New rail carries a large one off carbon cost in steel, concrete and earthworks, then saves emissions for decades.\",\n      \"Land take is permanent, so schemes are judged on habitat replacement as well as journey times.\",\n      \"Useful follow up: who should decide, the people on the route or the people who would use the line?\"\n    ]\n  },\n  {\n    prompt: \"Would you rather discover...\",\n    a: \"A badger sett on your project site\",\n    b: \"A bat roost in a bridge you are due to repair\",\n    discuss: \"Both are protected in law and both come with seasons and licences. Which one would cost you more time?\",\n    notes: [\n      \"Badgers and their setts are protected under the Protection of Badgers Act 1992. Closing a sett needs a licence and cannot happen in the breeding season.\",\n      \"All UK bats and their roosts are protected. Bridge and building work needs a roost survey, and often a licence and a replacement roost.\",\n      \"Both are why ecology surveys are booked months ahead of the programme, not the week before.\"\n    ]\n  },\n  {\n    prompt: \"Would you rather...\",\n    a: \"Relocate 100 frogs safely\",\n    b: \"Plant 100 trees\",\n    discuss: \"One saves what is already there, one adds something new. Which leaves more behind in ten years?\",\n    notes: [\n      \"Moving animals only works if there is suitable habitat to move them to, and someone to look after it.\",\n      \"Planted trees have a survival rate. Schemes are measured on trees still alive after five years, not trees put in the ground.\",\n      \"This is the biodiversity net gain argument in miniature: protect first, replace second, plant last.\"\n    ]\n  },\n  {\n    prompt: \"Would you rather receive...\",\n    a: \"A noise complaint from 100 local residents\",\n    b: \"One complaint from the Environment Agency\",\n    discuss: \"Which is harder to put right, the relationship with the street or the record with the regulator?\",\n    notes: [\n      \"A regulator complaint goes on the company record and can lead to enforcement or loss of consents.\",\n      \"A hundred residents can hold up a planning condition, a consent, or the next job in that town.\",\n      \"Most sites treat both the same way: log it, fix the cause, go back and tell the person what changed.\"\n    ]\n  }\n];\n\nconst STEPS = [{ kind: \"join\" }];\nQUESTIONS.forEach((_, i) => {\n  STEPS.push({ kind: \"vote\", q: i });\n  STEPS.push({ kind: \"results\", q: i });\n});\nSTEPS.push({ kind: \"end\" });\nconst LAST = STEPS.length - 1;\n\nconst GREEN = \"#75b12c\";\nconst AMBER = \"#f49700\";\nconst DEFAULT_CFG = { url: \"https://fqfabvpcpaiabrrmifeh.supabase.co\", key: \"sb_publishable_yKHV4egHMjPRlBWFnAHp8Q_VUtPDtrw\" };\nconst TABLE = \"wyr_answers\";\nconst URL_KEY = \"wyr-supabase-url\";\nconst KEY_KEY = \"wyr-supabase-key\";\nconst ROOM_KEY = \"wyr-room-code\";\nconst CLIENT_KEY = \"wyr-client-id\";\n\nfunction randomCode(n) {\n  const chars = \"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\n  let s = \"\";\n  for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * chars.length)];\n  return s;\n}\n\nfunction readStore(key) {\n  try { return window.localStorage.getItem(key); } catch (e) { return null; }\n}\nfunction writeStore(key, val) {\n  try { window.localStorage.setItem(key, val); } catch (e) { /* ignore */ }\n}\n\nclass Component extends DCLogic {\n  qrRef = React.createRef();\n  qrUri = null;\n  state = {\n    role: \"host\",\n    view: \"host\",\n    setupOpen: false,\n    cfg: null,\n    urlText: \"\",\n    keyText: \"\",\n    cfgError: \"\",\n    live: false,\n    roomCode: \"\",\n    pos: 0,\n    notesOpen: false,\n    answers: {},\n    storeWarning: false,\n    joined: 0,\n    pick: null,\n    qrReady: false\n  };\n\n  componentDidMount() {\n    const hash = typeof location !== \"undefined\" ? location.hash : \"\";\n    const params = new URLSearchParams(hash.replace(/^#/, \"\"));\n    const roomParam = (params.get(\"room\") || \"\").toUpperCase();\n    const isGuest = !!roomParam;\n    const code = isGuest ? roomParam : (readStore(ROOM_KEY) || randomCode(4));\n    if (!isGuest) writeStore(ROOM_KEY, code);\n\n    let clientId = readStore(CLIENT_KEY);\n    if (!clientId) { clientId = \"c\" + randomCode(8) + Date.now().toString(36); writeStore(CLIENT_KEY, clientId); }\n    this.clientId = clientId;\n\n    const sUrl = params.get(\"u\") || readStore(URL_KEY) || DEFAULT_CFG.url || \"\";\n    const sKey = params.get(\"k\") || readStore(KEY_KEY) || DEFAULT_CFG.key || \"\";\n    const cfg = sUrl && sKey ? { url: sUrl, key: sKey } : null;\n    if (cfg) { writeStore(URL_KEY, sUrl); writeStore(KEY_KEY, sKey); }\n\n    this.setState({\n      role: isGuest ? \"guest\" : \"host\",\n      view: isGuest ? \"phone\" : \"host\",\n      roomCode: code,\n      cfg,\n      urlText: sUrl,\n      keyText: sKey,\n      setupOpen: !isGuest && !cfg\n    }, () => {\n      this.makeQr();\n      if (cfg) this.connect(cfg);\n    });\n\n    this.onKey = (e) => {\n      if (this.state.role === \"guest\" || this.state.setupOpen) return;\n      if (e.key === \"ArrowRight\") { e.preventDefault(); this.go(1); }\n      else if (e.key === \"ArrowLeft\") { e.preventDefault(); this.go(-1); }\n      else if (e.key === \"n\" || e.key === \"N\") { this.setState(s => ({ notesOpen: !s.notesOpen })); }\n    };\n    window.addEventListener(\"keydown\", this.onKey);\n  }\n\n  componentDidUpdate() { this.applyQr(); }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"keydown\", this.onKey);\n    if (this.channel) this.channel.unsubscribe();\n  }\n\n  joinUrl() {\n    return this.props.joinUrl || \"https://storycontractingltd.github.io/Would-you-Rather/\";\n  }\n\n  makeQr(tries = 0) {\n    const cfg = this.state.cfg;\n    let url = this.joinUrl() + \"#room=\" + (this.state.roomCode || \"\");\n    if (cfg && cfg.url && cfg.key) {\n      url += \"&u=\" + encodeURIComponent(cfg.url) + \"&k=\" + encodeURIComponent(cfg.key);\n    }\n    if (typeof window.qrcode !== \"function\") {\n      if (tries < 40) setTimeout(() => this.makeQr(tries + 1), 150);\n      return;\n    }\n    try {\n      const qr = window.qrcode(0, \"M\");\n      qr.addData(url);\n      qr.make();\n      this.qrUri = \"data:image/svg+xml;utf8,\" + encodeURIComponent(qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true }));\n      this.setState({ qrReady: true }, () => this.applyQr());\n    } catch (e) { /* placeholder stays */ }\n  }\n\n  applyQr() {\n    if (this.qrUri && this.qrRef.current && this.qrRef.current.getAttribute(\"src\") !== this.qrUri) {\n      this.qrRef.current.src = this.qrUri;\n    }\n  }\n\n  mergeVote(q, id, choice) {\n    if (q === undefined || q === null || !id || !choice) return;\n    this.setState(s => {\n      const answers = Object.assign({}, s.answers);\n      const key = String(q);\n      const row = Object.assign({}, answers[key]);\n      row[id] = choice;\n      answers[key] = row;\n      return { answers };\n    });\n  }\n\n  loadAnswers() {\n    if (!this.client) return;\n    const room = this.state.roomCode;\n    this.client.from(TABLE).select(\"q,client,choice\").eq(\"room\", room).then(({ data, error }) => {\n      if (error || !data) { this.setState({ storeWarning: true }); return; }\n      const answers = {};\n      data.forEach(r => {\n        const key = String(r.q);\n        answers[key] = answers[key] || {};\n        answers[key][r.client] = r.choice;\n      });\n      this.setState({ answers, storeWarning: false });\n    });\n  }\n\n  connect(cfg, tries = 0) {\n    if (!window.supabase || !window.supabase.createClient) {\n      if (tries < 40) setTimeout(() => this.connect(cfg, tries + 1), 200);\n      else this.setState({ cfgError: \"Could not load Supabase. Check the internet connection.\" });\n      return;\n    }\n    try {\n      this.client = window.supabase.createClient(cfg.url, cfg.key, { realtime: { params: { eventsPerSecond: 20 } } });\n    } catch (e) {\n      this.setState({ cfgError: \"That project did not work: \" + e.message });\n      return;\n    }\n    const isGuest = this.state.role === \"guest\";\n    const ch = this.client.channel(\"wyr-\" + this.state.roomCode, {\n      config: { presence: { key: this.clientId }, broadcast: { self: false } }\n    });\n    this.channel = ch;\n\n    ch.on(\"broadcast\", { event: \"state\" }, ({ payload }) => {\n      if (!isGuest || !payload) return;\n      const pos = typeof payload.pos === \"number\" ? payload.pos : 0;\n      this.setState(s => {\n        const prev = STEPS[s.pos] || STEPS[0];\n        const nextStep = STEPS[pos] || STEPS[0];\n        const sameQuestion = prev.q === nextStep.q && prev.q !== undefined;\n        return { pos, pick: sameQuestion ? s.pick : null };\n      });\n    });\n\n    ch.on(\"broadcast\", { event: \"vote\" }, ({ payload }) => {\n      if (isGuest || !payload) return;\n      this.mergeVote(payload.q, payload.id, payload.choice);\n    });\n\n    if (!isGuest) {\n      ch.on(\"postgres_changes\", { event: \"*\", schema: \"public\", table: TABLE, filter: \"room=eq.\" + this.state.roomCode }, (payload) => {\n        const row = payload.new;\n        if (row) this.mergeVote(row.q, row.client, row.choice);\n      });\n    }\n\n    ch.on(\"broadcast\", { event: \"hello\" }, () => { if (!isGuest) this.pushState({}); });\n\n    ch.on(\"presence\", { event: \"sync\" }, () => {\n      const present = ch.presenceState() || {};\n      let n = 0;\n      Object.keys(present).forEach(k => {\n        const metas = present[k] || [];\n        if (metas.some(m => m.role === \"guest\")) n++;\n      });\n      this.setState({ joined: n });\n    });\n\n    ch.subscribe(status => {\n      if (status === \"CHANNEL_ERROR\" || status === \"TIMED_OUT\") {\n        this.setState({ live: false, cfgError: \"Could not reach that Supabase project. Check the URL and anon key.\" });\n        return;\n      }\n      if (status !== \"SUBSCRIBED\") return;\n      ch.track({ role: isGuest ? \"guest\" : \"host\" });\n      if (isGuest) ch.send({ type: \"broadcast\", event: \"hello\", payload: {} });\n      else { this.pushState({}); this.loadAnswers(); }\n      this.setState({ live: true, setupOpen: false, cfgError: \"\" });\n    });\n  }\n\n  pushState(extra) {\n    if (!this.channel) return;\n    const pos = extra.pos !== undefined ? extra.pos : this.state.pos;\n    this.channel.send({ type: \"broadcast\", event: \"state\", payload: { pos } });\n  }\n\n  go(dir) {\n    const pos = Math.max(0, Math.min(LAST, this.state.pos + dir));\n    if (pos === this.state.pos) return;\n    const prev = STEPS[this.state.pos];\n    const nextStep = STEPS[pos];\n    const sameQuestion = prev.q === nextStep.q && prev.q !== undefined;\n    this.setState({ pos, notesOpen: false, pick: sameQuestion ? this.state.pick : null });\n    this.pushState({ pos });\n  }\n\n  vote(choice) {\n    const step = STEPS[this.state.pos];\n    if (!step || step.kind !== \"vote\") return;\n    const q = step.q;\n    this.setState({ pick: choice });\n    if (this.channel) this.channel.send({ type: \"broadcast\", event: \"vote\", payload: { id: this.clientId, q, choice } });\n    if (this.client) {\n      this.client.from(TABLE)\n        .upsert({ room: this.state.roomCode, q, client: this.clientId, choice }, { onConflict: \"room,q,client\" })\n        .then(({ error }) => { if (error) this.setState({ storeWarning: true }); });\n    }\n  }\n\n  countsFor(i) {\n    const node = this.state.answers[String(i)] || {};\n    let a = 0, b = 0;\n    Object.keys(node).forEach(k => { if (node[k] === \"a\") a++; else if (node[k] === \"b\") b++; });\n    return [a, b];\n  }\n\n  renderVals() {\n    const { pos, view, role, notesOpen, pick, live, setupOpen } = this.state;\n    const step = STEPS[pos] || STEPS[0];\n    const onQuestion = step.kind === \"vote\" || step.kind === \"results\";\n    const qIdx = onQuestion ? step.q : 0;\n    const q = QUESTIONS[qIdx];\n    const counts = onQuestion ? this.countsFor(qIdx) : [0, 0];\n    const total = counts[0] + counts[1];\n    const pctA = total ? Math.round((counts[0] / total) * 100) : 0;\n    const pctB = total ? 100 - pctA : 0;\n\n    const card = (bg) => \"display: flex; flex-direction: column; justify-content: space-between; gap: clamp(10px, 1.6vh, 24px); color: #14181c; background: \" + bg + \"; border-radius: 4px; padding: clamp(18px, 2.4vw, 38px); min-height: clamp(160px, 26vh, 360px)\";\n    const resultCard = (bg) => \"display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 16px); color: #14181c; background: \" + bg + \"; border-radius: 4px; padding: clamp(14px, 2vw, 28px)\";\n    const ghost = \"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(11px, 1.5vh, 15px); letter-spacing: 0.04em; text-transform: uppercase; color: #ffffff; background: transparent; border: 2px solid rgba(255,255,255,0.55); border-radius: 4px; padding: clamp(10px, 1.3vh, 15px) clamp(14px, 1.7vw, 24px); min-height: 44px; cursor: pointer; transition: background 200ms cubic-bezier(.2,.7,.2,1)\";\n    const primary = \"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: clamp(13px, 1.8vh, 18px); letter-spacing: 0.04em; text-transform: uppercase; color: #0061ad; background: #ffffff; border: 0; border-radius: 4px; padding: clamp(11px, 1.5vh, 17px) clamp(20px, 2.4vw, 32px); min-height: 44px; cursor: pointer; transition: background 200ms cubic-bezier(.2,.7,.2,1)\";\n    const tab = (on) => \"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 13px; border: 0; cursor: pointer; background: \" + (on ? \"#ffffff\" : \"transparent\") + \"; color: \" + (on ? \"#0061ad\" : \"#ffffff\");\n    const phoneOpt = (bg) => \"display: flex; align-items: center; gap: 14px; background: \" + bg + \"; color: #14181c; border: 0; border-radius: 4px; padding: 16px 18px; min-height: 64px; cursor: pointer; transition: filter 200ms cubic-bezier(.2,.7,.2,1)\";\n    const bar = (pct) => \"height: 100%; width: \" + (total ? pct : 0) + \"%; background: #14181c; transition: width 300ms cubic-bezier(.2,.7,.2,1)\";\n\n    const stepLabel = step.kind === \"join\" ? \"Waiting to start\"\n      : step.kind === \"end\" ? \"Wrap up\"\n      : (step.kind === \"vote\" ? \"Question \" : \"Results \") + (qIdx + 1) + \" of \" + QUESTIONS.length;\n\n    return {\n      sessionTitle: this.props.sessionTitle ?? \"Sustainability in Engineering and Construction\",\n      roomCode: this.state.roomCode,\n      qrRef: this.qrRef,\n      hasQr: this.state.qrReady,\n      noQr: !this.state.qrReady,\n      isSetup: setupOpen,\n      isHostView: !setupOpen && view === \"host\",\n      isPhoneView: !setupOpen && view === \"phone\",\n      isJoin: step.kind === \"join\",\n      isVoting: step.kind === \"vote\",\n      isResults: step.kind === \"results\",\n      isEnd: step.kind === \"end\",\n      q,\n      questionNumber: qIdx + 1,\n      notesOpen,\n      notes: q.notes.map(t => ({ text: t })),\n      progressLabel: stepLabel,\n      liveLabel: live ? \"Live\" : \"Offline\",\n      liveBadgeStyle: \"font-family: Montserrat, Arial, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; color: #14181c; background: \" + (live ? GREEN : \"#dee0e1\"),\n      joinBlurb: live\n        ? \"Scan the code, then answer on your phone. Six questions about sustainability on real construction sites. There are no right answers, only trade offs.\"\n        : \"Six questions about sustainability on real construction sites. Pick a side by hands up or by moving to one side of the room. There are no right answers, only trade offs.\",\n      joinHint: live ? \"Scan to join room\" : \"Room\",\n      joinedLabel: live ? (this.state.joined === 1 ? \"1 phone joined\" : this.state.joined + \" phones joined\") : \"Live voting is off\",\n      answeredCount: live ? total : \"—\",\n      votingHint: live\n        ? (this.state.storeWarning ? \"Answers are not being saved, check the table exists\" : \"Move on when everyone has answered\")\n        : \"Live voting is off, take it on hands up\",\n      resultsTotalLabel: total === 0 ? \"No answers\" : (total === 1 ? \"1 answer\" : total + \" answers\"),\n      pctALabel: total ? pctA + \"%\" : \"—\",\n      pctBLabel: total ? pctB + \"%\" : \"—\",\n      countALabel: counts[0] === 1 ? \"1 vote\" : counts[0] + \" votes\",\n      countBLabel: counts[1] === 1 ? \"1 vote\" : counts[1] + \" votes\",\n      barAStyle: bar(pctA),\n      barBStyle: bar(pctB),\n      cardAStyle: card(GREEN),\n      cardBStyle: card(AMBER),\n      resultAStyle: resultCard(GREEN),\n      resultBStyle: resultCard(AMBER),\n      ghostBtn: ghost,\n      primaryBtn: primary,\n      notesLabel: notesOpen ? \"Hide notes\" : \"Host notes\",\n      nextLabel: qIdx === QUESTIONS.length - 1 ? \"Wrap up →\" : \"Next question →\",\n      hostTabStyle: tab(view === \"host\"),\n      phoneTabStyle: tab(view === \"phone\"),\n      phoneA: phoneOpt(GREEN),\n      phoneB: phoneOpt(AMBER),\n      phonePreviewNote: role === \"host\",\n      phoneStep: onQuestion ? (qIdx + 1) + \" of \" + QUESTIONS.length : (step.kind === \"join\" ? \"Room \" + this.state.roomCode : \"Finished\"),\n      phoneWaiting: !onQuestion,\n      phoneVoting: step.kind === \"vote\" && !pick,\n      phoneDone: (step.kind === \"vote\" && !!pick) || step.kind === \"results\",\n      phoneCanChange: step.kind === \"vote\",\n      phonePickLabel: pick === \"a\" ? \"A, \" + q.a : (pick === \"b\" ? \"B, \" + q.b : \"Not answered\"),\n      phoneDoneBody: step.kind === \"results\" ? \"The results are on the screen at the front.\" : \"Look up at the screen when the results go up.\",\n      phoneWaitTitle: step.kind === \"join\" ? \"You are in\" : \"That is all six\",\n      phoneWaitBody: step.kind === \"join\" ? \"Wait for the first question to come up on the screen at the front.\" : \"Thanks for taking part. Keep the questions in mind next time you see a site fenced off.\",\n      phoneFootnote: role === \"guest\" ? \"Answers are anonymous. Only the totals go on the screen at the front.\" : \"Students reach this by scanning the code. Their answers appear as counts on the room screen.\",\n      urlText: this.state.urlText,\n      keyText: this.state.keyText,\n      cfgError: this.state.cfgError,\n      onUrlChange: (e) => this.setState({ urlText: e.target.value }),\n      onKeyChange: (e) => this.setState({ keyText: e.target.value }),\n      saveCfg: () => {\n        const url = (this.state.urlText || \"\").trim().replace(/\\/$/, \"\");\n        const key = (this.state.keyText || \"\").trim();\n        if (!/^https:\\/\\/.+\\.supabase\\.co$/.test(url)) {\n          this.setState({ cfgError: \"The Project URL should look like https://yourproject.supabase.co\" });\n          return;\n        }\n        if (key.length < 20) {\n          this.setState({ cfgError: \"Paste the full publishable or anon key from Project Settings, then API.\" });\n          return;\n        }\n        writeStore(URL_KEY, url);\n        writeStore(KEY_KEY, key);\n        const cfg = { url, key };\n        this.setState({ cfg, cfgError: \"\" }, () => { this.makeQr(); this.connect(cfg); });\n      },\n      skipCfg: () => this.setState({ setupOpen: false, live: false }),\n      recap: QUESTIONS.map((item, i) => {\n        const c = this.countsFor(i);\n        const t = c[0] + c[1];\n        const a = t ? Math.round((c[0] / t) * 100) : 0;\n        return {\n          n: String(i + 1).padStart(2, \"0\"),\n          label: item.a + \"  or  \" + item.b,\n          score: t ? a + \"% / \" + (100 - a) + \"%\" : \"no answers\",\n          aStyle: \"width: \" + (t ? a : 0) + \"%; background: \" + GREEN,\n          bStyle: \"width: \" + (t ? 100 - a : 0) + \"%; background: \" + AMBER\n        };\n      }),\n      next: () => this.go(1),\n      back: () => this.go(-1),\n      restart: () => {\n        const code = randomCode(4);\n        if (this.client) this.client.from(TABLE).delete().eq(\"room\", this.state.roomCode).then(() => {});\n        writeStore(ROOM_KEY, code);\n        this.setState({ pos: 0, notesOpen: false, pick: null, roomCode: code, answers: {} }, () => {\n          this.makeQr();\n          if (this.state.cfg) {\n            if (this.channel) this.channel.unsubscribe();\n            this.connect(this.state.cfg);\n          }\n        });\n      },\n      toggleNotes: () => this.setState(s => ({ notesOpen: !s.notesOpen })),\n      showHost: () => this.setState({ view: \"host\" }),\n      showPhone: () => this.setState({ view: \"phone\" }),\n      phoneVoteA: () => this.vote(\"a\"),\n      phoneVoteB: () => this.vote(\"b\"),\n      phoneChange: () => this.setState({ pick: null })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
